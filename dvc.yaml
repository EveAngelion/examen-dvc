stages:
  split:
    cmd: python src/data/DVC_split.py
    deps:
    - data/raw/raw.csv
    - src/data/DVC_split.py
    outs:
    - data/processed/X_train.csv
    - data/processed/X_test.csv
    - data/processed/y_train.csv
    - data/processed/y_test.csv
  normalize:
    cmd: python src/data/DVC_Normalize.py
    deps:
    - data/processed/X_test.csv
    - data/processed/X_train.csv
    - src/data/DVC_Normalize.py
    outs:
    - data/processed/X_test_scaled.csv
    - data/processed/X_train_scaled.csv
    - models/scaler.pkl
  gridsearch:
    cmd: python src/models/DVC_GridSearch.py
    deps:
    - data/processed/X_train_scaled.csv
    - data/processed/y_train.csv
    - src/models/DVC_GridSearch.py
    outs:
    - models/best_params.pkl
  training:
    cmd: python src/models/DVC_train.py
    deps:
    - data/processed/X_train_scaled.csv
    - data/processed/y_train.csv
    - models/best_params.pkl
    - src/models/DVC_train.py
    outs:
    - models/gbr_model.pkl
  evaluate:
    cmd: python src/models/DVC_evaluation.py
    deps:
    - data/processed/X_test_scaled.csv
    - data/processed/y_test.csv
    - models/gbr_model.pkl
    - src/models/DVC_evaluation.py
    outs:
    - data/predictions.csv
    metrics:
    - metrics/scores.json:
        cache: false
